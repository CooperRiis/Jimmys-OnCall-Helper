name: Discord DM Alert
on:
  workflow_dispatch:
    inputs:
      priority:
        description: 'The priority of the Jira ticket'
        required: true
        type: string

jobs:
  filter-and-dm:
    runs-on: ubuntu-latest
    steps:
      - name: Check After-Hours Time
        id: time_check
        run: |
          CURRENT_HOUR=$(TZ="America/New_York" date +'%H')
          echo "Current local hour: $CURRENT_HOUR"
          echo "IS_AFTER_HOURS=true" >> $GITHUB_OUTPUT

      - name: Dispatch Discord DM
        if: steps.time_check.outputs.IS_AFTER_HOURS == 'true'
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          USER_ID: ${{ secrets.DISCORD_USER_ID }}
          PRIORITY: ${{ github.event.inputs.priority }}
        run: |
          # Step 1: Create DM channel
          DM_RESPONSE=$(curl -s -X POST "https://discord.com/api/v10/users/@me/channels" \
            -H "Authorization: Bot $BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"recipient_id\": \"$USER_ID\"}")
          
          DM_CHANNEL_ID=$(echo "$DM_RESPONSE" | jq -r '.id')
          
          if [ -z "$DM_CHANNEL_ID" ] || [ "$DM_CHANNEL_ID" = "null" ]; then
            echo "Error creating DM channel:"
            echo "$DM_RESPONSE"
            exit 1
          fi
          
          echo "DM Channel ID: $DM_CHANNEL_ID"
          
          PRIORITY_UPPER=$(echo "$PRIORITY" | tr '[:lower:]' '[:upper:]')
          
          if [[ "$PRIORITY_UPPER" =~ (HIGHEST|HIGH|CRITICAL|P1) ]]; then
            ALERT_TEXT="**HIGH PRIORITY TICKET** - You have **1 hour** to respond and triage."
            COLOR=15158332
          elif [[ "$PRIORITY_UPPER" =~ (MEDIUM|P2) ]]; then
            ALERT_TEXT="**MEDIUM PRIORITY TICKET** - You have **2 hours** to respond and triage."
            COLOR=15105570
          else
            ALERT_TEXT="**NEW TICKET** - Priority: $PRIORITY"
            COLOR=3447003
          fi
          
          curl -s -X POST "https://discord.com/api/v10/channels/$DM_CHANNEL_ID/messages" \
            -H "Authorization: Bot $BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$ALERT_TEXT\", \"embeds\": [{\"title\": \"Action Required: Check Jira\", \"description\": \"An after-hours ticket has been logged.\", \"color\": $COLOR}]}"
          
          echo "Message sent successfully!"
